# @claude mention handler: comment "@claude fix this" on any issue or PR and
# Claude implements it on a branch and opens a PR.
#
# Setup per repo (once per org, really):
#   1. Easiest: run /install-github-app inside Claude Code — it installs the
#      Claude GitHub App and can generate this workflow. Or install manually:
#      github.com/apps/claude
#   2. Add org secret CLAUDE_CODE_OAUTH_TOKEN — generated with
#      `claude setup-token` on a machine logged into the Claude Max
#      subscription (the Mac Mini setup prompt does this). Usage draws from
#      that subscription, no separate API billing. Note: the token is tied to
#      one person's account and shares their rate limits.
#   3. The Claude GitHub App is REQUIRED for PRs created here to trigger CI —
#      PRs made with the default GITHUB_TOKEN do not start workflows.
#
# Guardrails: max-turns bounds runaway sessions; branch protection (required
# human review + green CI) is the merge gate — see GUARDRAILS.md.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@a4f54ef2c58884867281bd8e2f8d63352ad019a9 # v1 (Claude Code 2.1.276)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 40"
